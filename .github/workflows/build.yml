name: 🏗️ 构建 Windows 版本

run-name: ${{ github.ref_type == 'tag' && '🚀 发布' || '🔨 构建' }} Windows · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 🔨 构建 Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 检出所选分支或标签
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: 🦀 安装项目指定的 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc

      - name: 🏷️ 校验引用与应用版本
        id: version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; d=json.load(sys.stdin); print(next((p['version'] for p in d['packages'] if p['name'] == 'quick-paste'), ''))")"
          if [ -z "$VERSION" ]; then
            echo "❌ Cargo 元数据中找不到 quick-paste 项目" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "❌ 标签 $GITHUB_REF_NAME 与 Cargo.toml 版本 $VERSION 不一致，请使用 v$VERSION 或 $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 引用类型：$GITHUB_REF_TYPE，引用名称：$GITHUB_REF_NAME，应用版本：$VERSION"

      - name: 🛠️ 初始化 x64 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 💾 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: 🧪 运行单元测试
        run: cargo test --release

      - name: 🔨 构建发布版
        run: cargo build --release

      - name: 🩺 验证发布程序不显示终端
        shell: pwsh
        run: |
          $stream = [System.IO.File]::OpenRead("target/release/quick-paste.exe")
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550) { throw '发布程序不是有效的 PE 文件' }
            $stream.Position = $peOffset + 24 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "发布程序未使用 Windows GUI 子系统，当前值：$subsystem"
            }
          } finally {
            $stream.Dispose()
          }
          Write-Host '✅ 已确认发布程序使用 Windows GUI 子系统，不会显示终端窗口'

      - name: 📊 产物列表
        run: ls -lh target/release/quick-paste.exe

      - name: ⬆️ 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: quick-paste-windows-x64
          path: target/release/quick-paste.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: 🚀 发布 GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ⬇️ 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: quick-paste-windows-x64
          path: dist

      - name: 📦 打包便携 ZIP
        shell: pwsh
        run: |
          $zip = "dist/quick-paste_$($env:APP_VERSION)_windows-x64-portable.zip"
          Compress-Archive -Path "dist/quick-paste.exe", "README.md", "LICENSE" -DestinationPath $zip -Force
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or (Get-Item -LiteralPath $zip).Length -eq 0) {
            throw "便携 ZIP 生成失败：$zip"
          }
          Write-Host "📦 已生成：$zip"

      - name: 🧾 校验发布产物
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -like '*.zip' })
          if ($assets.Count -ne 1) { throw "发布产物数量错误，预期 1 个，实际 $($assets.Count) 个" }
          if ($assets[0].Length -eq 0) { throw "发布产物为空：$($assets[0].FullName)" }
          Write-Host '📊 待发布产物：'
          $assets | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: 🚀 创建并发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $prerelease = ($tag.Split('+')[0].Contains('-')).ToString().ToLowerInvariant()
          $zip = Get-ChildItem -LiteralPath dist -File -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw '找不到便携 ZIP' }

          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "已存在 Release $tag，拒绝覆盖；如需重新发布请先删除该 Release"
          }

          gh release create $tag --repo $repo --verify-tag --prerelease=$prerelease --title "快速粘贴 $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败，退出码：$LASTEXITCODE" }

          gh release upload $tag $zip.FullName --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 产物失败，退出码：$LASTEXITCODE" }
          Write-Host "✅ 已发布 $tag"
